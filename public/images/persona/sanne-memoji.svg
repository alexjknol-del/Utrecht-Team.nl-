    <path d="M90 480c0-88 67-142 150-142s150 54 150 142z" fill="#e2a038"/>
    <path d="M90 480c0-70 45-118 100-134-8 20-10 44 4 60 18 22 52 22 70 0 14-16 12-40 4-60 55 16 100 64 100 134z" fill="#c98f2b"/>

    <!-- neck -->
    <rect x="205" y="255" width="70" height="70" rx="20" fill="#e7b98c"/>

    <!-- hair back -->
    <path d="M120 205c0-80 54-140 120-140s120 60 120 140c0 30-6 55-14 55-4-46-24-70-40-46-8-30-24-46-46-46s-38 16-46 46c-16-24-36 0-40 46-8 0-14-25-14-55z" fill="#5b3a29"/>

    <!-- face -->
    <ellipse cx="240" cy="220" rx="98" ry="104" fill="#e7b98c"/>

    <!-- ears -->
    <circle cx="140" cy="222" r="16" fill="#e7b98c"/>
    <circle cx="340" cy="222" r="16" fill="#e7b98c"/>

